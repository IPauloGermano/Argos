name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: hermes
          POSTGRES_DB: hermes
        ports: ["5433:5432"]
        options: >-
          --health-cmd="pg_isready -U hermes"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pip-audit
      - name: Run pytest
        run: |
          python -m pytest backend/tests -q
      - name: Alembic upgrade head (Postgres real)
        env:
          DATABASE_URL: postgresql+psycopg://hermes:hermes@localhost:5433/hermes
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini check
      - name: Dependency audit
        run: |
          pip-audit --desc || pip-audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: ./node_modules/.bin/tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config
        run: docker compose config
      - name: Build backend
        run: docker build ./backend
      - name: Build frontend
        run: docker build ./frontend
